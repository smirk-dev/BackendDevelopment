{% extends "base.html" %}
{% block title %}Static image{% endblock %}
{% block content %}
  <h1>An image from static/images/</h1>
  <figure>
    <img src="{{ url_for('static', path=image) }}" alt="Line drawing of a server rack with three units" width="320" height="240">
    <figcaption>Served by <code>StaticFiles</code> at <code>/static/{{ image }}</code>.</figcaption>
  </figure>
{% endblock %}
