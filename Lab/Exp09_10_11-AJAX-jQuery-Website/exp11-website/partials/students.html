<section>
  <h2>Students</h2>
  <div class="controls">
    <div class="row">
      <label for="source">Data source</label>
      <select id="source">
        <option value="json">Static JSON — data/students.json</option>
        <option value="xml">Static XML — data/students.xml</option>
        <option value="api">Express API — /api/students</option>
      </select>
      <button id="load-all">Load students</button>
    </div>
    <div class="row">
      <label for="search">Search by name</label>
      <input type="search" id="search" placeholder="type to filter" autocomplete="off" aria-describedby="search-count">
      <span class="count" id="search-count" aria-live="polite"></span>
    </div>
    <div class="row">
      <label for="course-pick">Course</label>
      <select id="course-pick"><option value="">Choose a course</option></select>
      <button id="course-js">Load course (JavaScript)</button>
      <button id="course-jq">Load course (jQuery)</button>
    </div>
  </div>
  <p class="status" id="students-status" role="status">Choose a data source and load the students.</p>
  <div class="table-scroll"><table>
    <thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Email</th><th>Semester</th></tr></thead>
    <tbody id="student-rows"><tr class="empty"><td colspan="5">No records loaded yet.</td></tr></tbody>
  </table></div>
</section>
