{% extends 'todo/base.html' %}
{% load static %}

{% block title %}Add Task | Task Tracker{% endblock %}

{% block extra_css %}
    <!-- Page-specific stylesheet (assignment template requirement 7). -->
    <link rel="stylesheet" href="{% static 'todo/css/add_task.css' %}">
{% endblock %}

{% block content %}
    <section class="panel">
        <h1>Add a task</h1>

        <form method="post" class="task-form">
            {% csrf_token %}
            <label for="title">Task title</label>
            <input id="title" type="text" name="title"
                   maxlength="200" required>
            <button type="submit">Save task</button>
        </form>

        <p><a href="{% url 'task_list' %}">Back to task list</a></p>
    </section>
{% endblock %}

{% block extra_js %}
    <!-- Page-specific script (assignment hint): live character count for the title. -->
    <script src="{% static 'todo/js/char_count.js' %}" defer></script>
{% endblock %}
